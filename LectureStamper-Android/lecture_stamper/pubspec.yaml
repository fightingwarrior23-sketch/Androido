name: lecture_stamper
description: Play a lecture next to its PDF slides, stamp when each slide appears, export a small video.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: ^1.2.8
  flutter_localizations:
    sdk: flutter
  pdfrx: ^1.1.0
  just_audio: ^0.9.40
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
